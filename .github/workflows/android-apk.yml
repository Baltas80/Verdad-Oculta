name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/informant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=verdad_oculta .

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: verdad-oculta-apk
          path: apps/informant/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
